<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Client Login | Adam Mind Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <div class="nav-container">

            <div class="brand">

                <a href="index.html">
                    <img
                        src="assets/images/logo.png"
                        class="nav-logo"
                        alt="Adam Mind Studio Logo"
                    >
                </a>

                <span>Adam Mind Studio</span>

            </div>

            <a href="index.html" class="login-back">
                Back to Website
            </a>

        </div>

    </nav>


    <main class="login-page">

        <div class="login-glow"></div>

        <div class="login-container">

            <div class="login-logo">

                <img
                    src="assets/images/logo.png"
                    alt="Adam Mind Studio Logo"
                >

            </div>

            <div class="section-label">
                CLIENT PORTAL
            </div>

            <h1>
                Welcome <span>back.</span>
            </h1>

            <p class="login-intro">
                Access your private client space, appointments,
                and therapy journey.
            </p>


            <form class="login-form">

                <div class="form-group">

                    <label for="email">
                        Email or Phone
                    </label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Enter your email or phone"
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>Remember me</span>

                    </label>

                    <a href="#" class="forgot-password">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn primary login-button"
                >
                    Login
                </button>

            </form>


            <div class="login-divider">
                <span>or</span>
            </div>


            <p class="create-account">
                Don't have an account?
                <a href="#" class="create-link">
                    Create Account
                </a>
            </p>


            <p class="privacy-note">
                Your client space is private and confidential.
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
