<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Adam Mind Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <div class="nav-container">

            <div class="brand">

                <a href="index.html">
                    <img
                        src="assets/images/logo.png"
                        class="nav-logo"
                        alt="Adam Mind Studio Logo"
                    >
                </a>

                <span>Adam Mind Studio</span>

            </div>

            <a href="index.html" class="login-back">
                Back to Website
            </a>

        </div>

    </nav>


    <main class="login-page">

        <div class="login-glow"></div>

        <div class="login-container">

            <div class="login-logo">

                <img
                    src="assets/images/logo.png"
                    alt="Adam Mind Studio Logo"
                >

            </div>

            <div class="section-label">
                CLIENT PORTAL
            </div>

            <h1>
                Create <span>your account.</span>
            </h1>

            <p class="login-intro">
                Create your private client space to manage
                appointments and stay connected.
            </p>


            <form class="login-form">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your mobile number"
                        autocomplete="tel"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                    >

                </div>


                <label class="remember signup-terms">

                    <input
                        type="checkbox"
                        name="terms"
                    >

                    <span>
                        I agree to the privacy policy and terms.
                    </span>

                </label>


                <button
                    type="submit"
                    class="btn primary login-button"
                >
                    Create Account
                </button>

            </form>


            <div class="login-divider">
                <span>or</span>
            </div>


            <p class="create-account">
                Already have an account?
                <a href="login.html" class="create-link">
                    Login
                </a>
            </p>


            <p class="privacy-note">
                Your information is private and confidential.
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
