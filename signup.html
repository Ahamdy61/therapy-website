<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Adam Mind Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <div class="nav-container">

            <div class="brand">

                <a href="index.html">
                    <img
                        src="assets/images/logo.png"
                        class="nav-logo"
                        alt="Adam Mind Studio Logo"
                    >
                </a>

                <span>Adam Mind Studio</span>

            </div>

            <a href="dashboard.html" class="login-back">
                Back to Dashboard
            </a>

        </div>

    </nav>


    <main class="profile-page">

        <div class="profile-page-glow"></div>

        <div class="profile-container">

            <div class="profile-page-header">

                <div class="section-label">
                    CLIENT PROFILE
                </div>

                <h1>
                    Your <span>profile.</span>
                </h1>

                <p>
                    Keep your personal information up to date.
                </p>

            </div>


            <div class="profile-edit-card">


                <!-- PROFILE PHOTO -->

                <div class="profile-photo-section">

                    <div class="profile-photo">

                        <span>
                            A
                        </span>

                    </div>

                    <button
                        type="button"
                        class="photo-button"
                    >
                        Change Photo
                    </button>

                    <p>
                        JPG or PNG · Max 5MB
                    </p>

                </div>


                <!-- PROFILE FORM -->

                <form class="profile-form">


                    <div class="profile-form-group">

                        <label for="profileName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="profileName"
                            name="profileName"
                            placeholder="Your full name"
                            value="Client Name"
                        >

                    </div>


                    <div class="profile-form-group">

                        <label for="profilePhone">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="profilePhone"
                            name="profilePhone"
                            placeholder="Your mobile number"
                            value="+20 100 000 0000"
                        >

                    </div>


                    <div class="profile-form-group">

                        <label for="profileBio">
                            About You
                            <span>Optional</span>
                        </label>

                        <textarea
                            id="profileBio"
                            name="profileBio"
                            rows="5"
                            maxlength="500"
                            placeholder="Tell us a little about yourself..."
                        ></textarea>

                        <small>
                            Maximum 500 characters
                        </small>

                    </div>


                    <div class="profile-actions">

                        <a
                            href="dashboard.html"
                            class="profile-cancel"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn primary profile-save"
                        >
                            Save Changes
                        </button>

                    </div>


                </form>

            </div>


            <div class="profile-privacy">

                <span>
                    🔒 Private & Confidential
                </span>

                <p>
                    Your personal information is only used
                    to manage your client experience.
                </p>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
